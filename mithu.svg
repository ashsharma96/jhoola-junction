<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="640" viewBox="0 0 600 640" role="img" aria-label="Mithu, a green parrot, sitting on a wooden swing hung with marigolds">
<!-- Jhoola Junction mascot "Mithu on the jhoola". Original artwork for the channel.
     Group ids name the parts so the renderer (S6) can split them into a rig. -->
<defs>
<filter id="wobSwing" x="-8%" y="-8%" width="116%" height="116%">
<feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<g id="marigold">
<circle r="19" fill="#F28C28" stroke="#2B1E16" stroke-width="4" stroke-dasharray="6 3"/>
<circle r="11" fill="#FFB627"/>
<circle r="4" fill="#C7561B"/>
</g>
</defs>
<g filter="url(#wobSwing)">
<g id="motion-lines">
<path d="M78 300 C 52 332, 52 384, 78 414" fill="none" stroke="#2B1E16" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
<path d="M42 322 C 24 346, 24 388, 42 406" fill="none" stroke="#2B1E16" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</g>
<g id="swing-and-mithu" transform="rotate(-6 300 0)">
<g id="swing-ropes">
<ellipse cx="150" cy="8" rx="17" ry="22" fill="none" stroke="#7A5230" stroke-width="8"/>
<ellipse cx="450" cy="8" rx="17" ry="22" fill="none" stroke="#7A5230" stroke-width="8"/>
<path d="M150 22 C 146 150, 153 285, 150 420" fill="none" stroke="#7A5230" stroke-width="10" stroke-linecap="round"/>
<path d="M150 22 C 146 150, 153 285, 150 420" fill="none" stroke="#C59360" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
<path d="M450 22 C 454 150, 447 285, 450 420" fill="none" stroke="#7A5230" stroke-width="10" stroke-linecap="round"/>
<path d="M450 22 C 454 150, 447 285, 450 420" fill="none" stroke="#C59360" stroke-width="4" stroke-dasharray="3 12" stroke-linecap="round"/>
<use xlink:href="#marigold" href="#marigold" transform="translate(150 150)"/>
<use xlink:href="#marigold" href="#marigold" transform="translate(151 282)"/>
<use xlink:href="#marigold" href="#marigold" transform="translate(450 138)"/>
<use xlink:href="#marigold" href="#marigold" transform="translate(449 270)"/>
</g>
